name: Build index

# index.json is generated: pull requests change data/ only, and this job rebuilds the index on main.
on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/build-index.mjs
      - name: Commit the index when it changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "chore: rebuild index.json"
            git push
          fi
